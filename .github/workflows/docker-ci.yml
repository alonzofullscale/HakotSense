name: Docker CI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
   pull_request:
   push:
      branches:
         - main

permissions:
   contents: read

jobs:
    build-and-test:
      name: Build and smoke test
      runs-on: ubuntu-latest
      timeout-minutes: 10

      steps:
        - name: Check out repository
          uses: actions/checkout@v6

        - name: Validate Compose configuration
          run: docker compose config --quiet

        - name: Build Docker image
          run: docker build --tag skilltrail:${{ github.sha }} .

        - name: Start container
          run: |
           docker run --detach \
             --name skilltrail-ci \
             --publish 8080:8080 \
             skilltrail:${{ github.sha }}

        - name: Wait for healthy container
          run: |
            for attempt in {1..20}; do
              status="$(docker inspect \
                --format='{{.State.Health.Status}}' \
                skilltrail-ci)"

              if [ "$status" = "healthy" ]; then
               echo "SkillTrail is healthy"
               exit 0
              fi

              echo "Attempt $attempt: container is $status"
              sleep 2
            done

            echo "Container did not become healthy"
            docker logs skilltrail-ci
            exit 1
        
        - name: Smoke test homepage
          run: |
             curl --fail --silent --show-error \
               http://127.0.0.1:8080/ \
               | grep --quiet "SkillTrail"
          

        - name: Show logs on failure
          if: failure()
          run: docker logs skilltrail-ci || true

        - name: Remove test container
          if: always()
          run: docker rm --force skilltrail-ci || true
    publish:
      name: Publish image to GHCR
      needs: build-and-test
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest

      permissions:
       contents: read
       packages: write

      steps:
       - name: Checkout repository
         uses: actions/checkout@v6

       - name: Login to Github container Registry
         uses: docker/login-action@v3
         with: 
           registry: ${{ env.REGISTRY }}
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}
       - name: Generate image tags and labels
         id: metadata
         uses: docker/metadata-action@v5
         with:
           images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
           tags: |
             type=sha,prefix=
             type=raw,value=latest

       - name: Build and publish image
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: ${{ steps.metadata.outputs.tags }}
           labels: ${{ steps.metadata.outputs.labels }}


  